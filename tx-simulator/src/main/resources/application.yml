server:
  port: 8080

spring:
  application:
    name: tx-simulator
  mvc:
    problemdetails:
      enabled: true   # validation errors are returned as RFC 7807 JSON
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # plain JSON without Java class-name headers, so any consumer (or language) can read it
        spring.json.add.type.headers: false
        # batch messages for up to 5 ms -> much higher throughput in auto mode
        linger.ms: 5
        # fail fast instead of blocking 60 s when Kafka is down
        max.block.ms: 5000

app:
  topics:
    transactions: transactions

management:
  endpoints:
    web:
      exposure:
        include: health,info
