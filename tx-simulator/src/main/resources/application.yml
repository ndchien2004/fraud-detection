server:
  port: 8080

spring:
  application:
    name: tx-simulator
  mvc:
    problemdetails:
      enabled: true   # validation errors are returned as RFC 7807 JSON

app:
  decision-api:
    url: ${DECISION_API_URL:http://localhost:8082}
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
  feature-service:
    # asked before a scenario, to pick a demo card whose recent history cannot spoil it
    url: ${FEATURE_SERVICE_URL:http://localhost:8084}
  auto-mode:
    # parallel calls to decision-api: one thread alone tops out around 100-150 tx/s
    threads: 32
    # share of auto-mode transactions that are deliberately anomalous (big amount, foreign city)
    anomaly-share: 0.02
  scenario:
    # pause between scenario transactions: gives the feature service time to update Redis
    step-delay-ms: 1000
  live-feed:
    # events are pushed to browsers in batches, so 500 tx/s do not mean 500 WebSocket frames/s
    flush-interval-ms: 250

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # show why a service is (not) healthy, e.g. Redis or Kafka Streams state
      show-details: always
