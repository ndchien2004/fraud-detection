# The whole system with one command:   docker compose up -d --build
#   Simulator UI  http://localhost:8080      Dashboard  http://localhost:8081
#   Kafka UI      http://localhost:8090
#
# Development mode (run the Java services yourself with mvnw): start only the infrastructure
#   docker compose up -d kafka redis kafka-ui
name: fraud-detection

# settings shared by the 5 Java services
x-java-service: &java-service
  build:
    context: .
  restart: unless-stopped
  environment: &java-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # the INTERNAL listener, reachable between containers
    REDIS_HOST: redis
    REDIS_PORT: 6379                       # inside the network Redis listens on its normal port

# "healthy" = GET /actuator/health answers {"status":"UP"} (curl -f fails on 503 OUT_OF_SERVICE/DOWN)
x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"   # for apps running on the host machine (mvnw spring-boot:run)
    environment:
      # KRaft mode: this single node is both broker and controller, no Zookeeper needed
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL = other containers (kafka:29092), EXTERNAL = host machine (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # single broker -> replication factor must be 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:8.8-alpine
    container_name: redis
    ports:
      - "6380:6379"   # 6380 on the host: 6379 is often taken by other projects' Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  feature-service:
    <<: *java-service
    build:
      context: .
      target: feature-service
    container_name: feature-service
    ports:
      - "8084:8084"
    environment:
      <<: *java-env
      KAFKA_STREAMS_STATE_DIR: /data/kafka-streams
    volumes:
      - feature-state:/data   # RocksDB state survives container restarts
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]

  scoring-service:
    <<: *java-service
    build:
      context: .
      target: scoring-service
    container_name: scoring-service
    ports:
      - "8083:8083"
    environment:
      <<: *java-env
      RULES_FILE: /config/rules.yaml
      MODEL_FILE: /models/model.onnx
    volumes:
      # mounted, not copied into the image: edit config/rules.yaml on your machine and it is
      # reloaded within 5 s; retrain the model and just restart the container
      - ./config:/config:ro
      - ./model-training/model.onnx:/models/model.onnx:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]

  decision-api:
    <<: *java-service
    build:
      context: .
      target: decision-api
    container_name: decision-api
    ports:
      - "8082:8082"
    environment:
      <<: *java-env
      SCORING_URL: http://scoring-service:8083
    depends_on:
      kafka:
        condition: service_healthy
      scoring-service:
        condition: service_healthy
      # transactions sent before the feature service is ready would still be counted later,
      # but waiting keeps the very first demo clean
      feature-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]

  tx-simulator:
    <<: *java-service
    build:
      context: .
      target: tx-simulator
    container_name: tx-simulator
    ports:
      - "8080:8080"
    environment:
      DECISION_API_URL: http://decision-api:8082
      FEATURE_SERVICE_URL: http://feature-service:8084
    depends_on:
      decision-api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]

  dashboard:
    <<: *java-service
    build:
      context: .
      target: dashboard
    container_name: dashboard
    ports:
      - "8081:8081"
    environment:
      <<: *java-env
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]

volumes:
  feature-state:
